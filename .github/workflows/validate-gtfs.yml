name: validate-gtfs

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: uv sync --locked

      # Canonical data is committed, so a pull request that hand-edits it is
      # caught here: reconciliation must reproduce exactly what is in the tree.
      - name: Evidence and reconciliation are reproducible
        run: |
          uv run almunecar-gtfs ingest --offline
          uv run almunecar-gtfs reconcile
          git diff --exit-code -- data/canonical data/evidence

      - name: Reports are reproducible
        run: |
          uv run almunecar-gtfs conflicts
          uv run almunecar-gtfs compare
          git diff --exit-code -- docs/conflicts.md docs/comparison.md

      - name: QA invariants
        run: uv run almunecar-gtfs check

      # While the dataset is research-stage there is nothing to build. The flag is
      # in data/publication.yaml so that flipping it is a reviewable data change.
      - name: Is the feed buildable yet?
        id: buildable
        run: |
          value=$(uv run python -c "import yaml,pathlib; \
            print(yaml.safe_load(pathlib.Path('data/publication.yaml').read_text()) \
            .get('feed_buildable', False))")
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "feed_buildable=$value"

      - name: Build GTFS
        if: steps.buildable.outputs.value == 'True'
        run: uv run almunecar-gtfs build

      - name: Build is deterministic
        if: steps.buildable.outputs.value == 'True'
        run: |
          sha256sum data/generated/almunecar-gtfs.zip > /tmp/first.sha
          uv run almunecar-gtfs build
          sha256sum -c /tmp/first.sha

      # Downloaded explicitly here rather than by the library, so the provenance
      # of the jar is visible in the workflow rather than hidden in code.
      - name: Fetch the MobilityData canonical GTFS validator
        if: steps.buildable.outputs.value == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MobilityData/gtfs-validator \
            --pattern 'gtfs-validator-*-cli.jar' --output /tmp/gtfs-validator.jar
          ls -l /tmp/gtfs-validator.jar

      - name: Validate
        if: steps.buildable.outputs.value == 'True'
        env:
          GTFS_VALIDATOR_JAR: /tmp/gtfs-validator.jar
        run: uv run almunecar-gtfs validate

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-validation-report
          path: qa/validation/
          if-no-files-found: ignore

      - name: Upload feed
        if: success() && steps.buildable.outputs.value == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: almunecar-gtfs
          path: data/generated/almunecar-gtfs.zip
