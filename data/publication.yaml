# Publication settings. Human-owned; reconciliation reads this and never writes it.
#
# `authorized_by_operator` stays false until Roalfa / Autocares Urbanos Almunecar
# has actually agreed to the feed being published on their behalf. While it is
# false, the README, the QA map and feed_info all describe the dataset as
# unofficial. Flipping it is a decision, not a formality.
authorized_by_operator: false

feed_publisher_name: "almunecar-gtfs (unofficial community feed)"
feed_publisher_url: "https://github.com/rtyx/almunecar-gtfs"
feed_contact_email: null
feed_contact_url: null

agency_id: "ALM"

# False while no source provides intermediate stop times, which GTFS requires.
# `almunecar-gtfs check` explains the blocker per pattern; CI skips the build and
# validator steps rather than reporting a permanent failure for a known gap.
feed_buildable: false
feed_buildable_blocker: >-
  The operator publishes only departures from the principal stop. No source found
  so far gives a time at any intermediate stop, and no observed vehicle runs are
  available to derive one. See docs/methodology.md, "Timings".
